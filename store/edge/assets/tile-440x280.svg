<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">Firelink Companion</title>
  <desc id="description">Send browser downloads and media pages to Firelink.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#252d3d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" rx="24" fill="url(#background)"/>
  <circle cx="80" cy="84" r="48" fill="#0b0f17" stroke="#ff7a00" stroke-width="3"/>
  <path d="M82 45c3 20-18 27-18 43 0 12 8 21 20 21 15 0 25-11 25-26 0-12-9-23-20-38 0 13-8 20-13 25-2-9 1-17 6-25Z" fill="url(#flame)"/>
  <path d="M82 70c-2 9-9 13-9 20 0 6 4 11 11 11 8 0 13-6 13-13 0-6-4-11-9-17-1 5-3 8-6 11-2-4-1-8 0-12Z" fill="#fff2d5" opacity="0.95"/>
  <text x="148" y="91" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">Firelink</text>
  <text x="148" y="119" fill="#ffad66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Companion</text>
  <text x="40" y="180" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Send downloads and media</text>
  <text x="40" y="208" fill="#d5dbe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">to your Firelink desktop app</text>
  <rect x="40" y="235" width="140" height="4" rx="2" fill="#ff7a00"/>
  <text x="200" y="243" fill="#9faabc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Review before download</text>
</svg>
