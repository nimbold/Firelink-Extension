<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../icons/icon-48.png" alt="" class="logo" id="header-logo">
      <div class="header-title-container">
        <h2>Firelink</h2>
        <div class="status-indicator" id="connection-status">
          <span class="status-dot"></span>
          <span class="status-text">Checking connection...</span>
        </div>
      </div>
      <button class="settings-toggle-btn" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path>
          <path d="m19.4 15 .1.1a1.9 1.9 0 0 1-2.7 2.7l-.1-.1a1.9 1.9 0 0 0-3.2 1.4v.2a1.9 1.9 0 0 1-3.8 0v-.2a1.9 1.9 0 0 0-3.2-1.4l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1A1.9 1.9 0 0 0 2.5 12a1.9 1.9 0 0 1 0-3.8h.2a1.9 1.9 0 0 0 1.4-3.2L4 4.9a1.9 1.9 0 1 1 2.7-2.7l.1.1A1.9 1.9 0 0 0 10 1a1.9 1.9 0 0 1 3.8 0v.2a1.9 1.9 0 0 0 3.2 1.4l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1A1.9 1.9 0 0 0 21 8.2h.2a1.9 1.9 0 0 1 0 3.8H21a1.9 1.9 0 0 0-1.6 3Z"></path>
        </svg>
      </button>
    </div>

    <div class="settings-panel" id="settings-panel" hidden>
      <label class="select-row" for="language-select">
        <span class="select-label" id="language-label">Language</span>
        <select id="language-select"></select>
      </label>
      <label class="select-row" for="theme-select">
        <span class="select-label" id="theme-label">Theme</span>
        <select id="theme-select"></select>
      </label>
    </div>
  
  <div class="settings">
    <button class="media-action" id="fetch-media-btn" type="button">
      <span class="media-action-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"></path>
        </svg>
      </span>
      <span class="media-action-copy">
        <span class="setting-title" id="fetch-media-label">Fetch media</span>
        <span class="setting-desc" id="media-status" role="status" aria-live="polite" aria-atomic="true">Current tab</span>
      </span>
    </button>

    <div class="setting-row compact-row">
      <div class="setting-info">
        <span class="setting-title" id="capture-downloads-label">Capture downloads</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="global-toggle" aria-labelledby="capture-downloads-label">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="setting-row compact-row" id="site-setting-row">
      <div class="setting-info">
        <span class="setting-title" id="disable-on-site-label">Disable on site</span>
        <span class="setting-desc" id="current-hostname">...</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="site-toggle" aria-labelledby="disable-on-site-label current-hostname">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="setting-row pairing-row" id="pairing-section">
      <button class="pairing-header" id="pairing-toggle-btn" type="button" aria-expanded="false" aria-controls="pairing-content">
        <span class="pairing-header-copy">
          <span class="setting-title" id="pairing-label">Pairing token</span>
          <span class="setting-desc" id="pairing-desc">Required for local handoff</span>
        </span>
        <svg class="pairing-chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7 9 5 5 5-5"></path>
        </svg>
      </button>

      <div class="pairing-content" id="pairing-content">
        <input type="password" id="extension-token" placeholder="Paste token here..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="save-token-btn">Save</button>
      </div>
    </div>
  </div>

  </div>
  <script src="../protocol.js"></script>
  <script src="locales.js"></script>
  <script src="popup.js"></script>
</body>
</html>
